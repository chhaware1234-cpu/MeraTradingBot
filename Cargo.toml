[package]
name = "telegram_signal_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ta = "0.5"
teloxide = { version = "0.12", features = ["macros"] }
dotenvy = "0.15"
futures = "0.3"
