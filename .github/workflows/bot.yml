name: Rust Crypto Signal Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Har 15 minute mein chalega
  workflow_dispatch: # Manual run karne ke liye

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Signals
        uses: actions/cache@v3
        with:
          path: bot_state_v2.json
          key: signal-cache-${{ github.run_id }}
          restore-keys: |
            signal-cache-

      - name: Run Bot
        env:
          TELOXIDE_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUST_LOG: info
        run: cargo run --release
